[project]
name = "controlfinder"
version = "0.1.0"
description = "Find the NIST SP 800-53 security controls that answer a question, with measured accuracy."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=2.5", "pg8000>=1.31", "fastapi>=0.143", "uvicorn>=0.54"]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx2>=2.13"]
mcp = ["mcp>=2.3"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
