name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only access to the code. The workflow can't change the repo or use any secrets.
permissions:
  contents: read

jobs:
  # The runner image is named, so CI doesn't change under us (same image as Car Safety Checker).
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to exact commits, so a hijacked tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt
      - name: Download NIST's files (pinned commit, hashes checked)
        run: python scripts/download_data.py
      - name: Run tests
        run: python -m pytest -q
      - name: Check the published results match the code
        run: |
          python scripts/run_keyword_baseline.py > /dev/null
          git diff --exit-code results docs/results.md
